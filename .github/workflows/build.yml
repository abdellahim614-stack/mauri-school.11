name: Build School APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Dart files from markdown tags
        run: |
          sed -i '/^```/d' user_app_main.dart
          sed -i '/^```/d' admin_app_main.dart

      - name: Build Teacher APK
        run: |
          flutter create --org com.maurischool.teacher teacher_project
          cp user_app_main.dart teacher_project/lib/main.dart
          cd teacher_project
          flutter pub add http shared_preferences url_launcher
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="سكرتير المدرسة"/g' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../teacher-app.apk

      - name: Build Admin APK
        run: |
          flutter create --org com.maurischool.admin admin_project
          cp admin_app_main.dart admin_project/lib/main.dart
          cd admin_project
          flutter pub add http
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="لوحة المدير"/g' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../admin-app.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Mauri-School-APKs
          path: |
            teacher-app.apk
            admin-app.apk
            
